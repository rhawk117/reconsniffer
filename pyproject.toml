[project]
name = "reconsniffer"
version = "1.1.0"
description = "Passive utility sniffing tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["loguru>=0.7.3", "rich>=15.0.0", "scapy>=2.7.0"]

[dependency-groups]
dev = ["ruff>=0.15.10"]

[project.scripts]
reconsniff = "reconsniff.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reconsniff"]
